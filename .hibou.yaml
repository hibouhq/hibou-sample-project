# yaml-language-server: $schema=https://hibou.dev/schemas/v1/hibou-config.schema.json
version: 1

# Demo thresholds: a PR shipping untested code (0% patch coverage) must block,
# a fully tested one must pass. The insecure.* fixtures keep weakness gates
# advisory — blocking on them would block every PR.
quality_gates:
  - branches: ["main"]
    enforcement: blocking
    weaknesses:
      max_high: 20
    licenses:
      deny_categories: ["copyleft", "network-copyleft", "source-available"]
      # OS packages dominate this project's component count (the fixture images
      # ship GPL base packages: busybox, apk-tools, tar, util-linux) and a distro
      # package the app runs on top of is not a linked dependency of its code.
      exempt_purls: ["pkg:apk/*", "pkg:deb/*"]
      # Departs from the fail-closed default on purpose: Trivy emits no license
      # for the reactor pom, for check.v1 (a test-only transitive of yaml.v2), or
      # for jars and Go binaries found inside an image. Failing a demo on the SBOM
      # generator's blind spots teaches nothing about license risk.
      deny_unknown: false
    coverage:
      min_coverage: 20
      grace: 2
      diff_minimum: 80
