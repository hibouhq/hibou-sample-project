name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    # Persist a snapshot for the release ref. NOTE: this workflow intentionally
    # attaches NO binaries to the GitHub release — it only uploads a Hibou
    # snapshot, so we can POC snapshot persistence across a release ref cheaply.
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ────────────────────────────────────────────────────────────────
      # Phase 1 — toolchains (SEQUENTIAL on purpose).
      # setup-* actions append to $GITHUB_PATH / $GITHUB_ENV; running them in
      # parallel steps would race on those files. Keep every env mutation here,
      # so the parallel phases below are pure `run` steps with no env writes.
      # ────────────────────────────────────────────────────────────────
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Pinned to a SHA, this action no longer reads the toolchain from its
      # ref name: it is passed explicitly.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      # Same: the tool to install comes from the ref name unless given.
      - uses: taiki-e/install-action@671164c891d3e20f5b8ece04798d0154d1262d65 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      # ────────────────────────────────────────────────────────────────
      # Phase 2 — build + test + coverage, in PARALLEL.
      # Each branch touches only its own language subdir and a disjoint tool
      # cache (~/go/bin, ~/.m2, ~/.cargo), so there are no cross-branch writes.
      # The trivy-DB warm shares nothing with the builds (writes ~/.cache/trivy)
      # and overlaps trivy's slow DB download with compilation.
      # ────────────────────────────────────────────────────────────────
      - parallel:
          - name: Go — test + coverage + gosec
            run: |
              export PATH="$(go env GOPATH)/bin:$PATH"
              cd go
              go install gotest.tools/gotestsum@latest
              gotestsum --junitfile junit-go.xml --format pkgname -- -coverprofile=coverage.out ./...
              go tool cover -func=coverage.out | tail -1
              go install github.com/securego/gosec/v2/cmd/gosec@latest
              gosec -fmt sarif -out ../gosec.sarif ./... || true

          - name: TypeScript — test + coverage
            run: |
              cd ts
              npm ci
              npm run coverage

          - name: Java — test + coverage
            run: |
              cd java
              mvn -q -B verify

          - name: Rust — test + coverage
            run: |
              cd rust
              cargo llvm-cov --lcov --output-path lcov.info

          - name: Trivy — warm vulnerability DB
            run: trivy fs --download-db-only

      # ────────────────────────────────────────────────────────────────
      # Phase 3 — SBOM + SARIF, in PARALLEL.
      # Safe now: Phase 2 completed (tree is stable, rust/Cargo.lock exists) and
      # the DB is warm. Each branch writes a DISTINCT output file, so concurrent
      # trivy invocations (read-only over the tree) never collide.
      # ────────────────────────────────────────────────────────────────
      - parallel:
          - name: SBOM — Go
            run: trivy fs --format cyclonedx --output go-sbom.cdx.json go/
          - name: SBOM — TypeScript
            run: trivy fs --format cyclonedx --output ts-sbom.cdx.json ts/
          - name: SBOM — Java
            run: trivy fs --format cyclonedx --output java-sbom.cdx.json java/
          - name: SBOM — Rust
            run: trivy fs --format cyclonedx --output rust-sbom.cdx.json rust/
          - name: Vuln + secret SARIF (repo)
            run: |
              trivy fs --format sarif --output trivy-fs.sarif \
                --skip-dirs ts/node_modules --skip-dirs java/target --skip-dirs rust/target .

          # Build the three intentionally-vulnerable OS images and emit one
          # CycloneDX SBOM per image. The SBOMs carry the OS packages with their
          # purl distro qualifiers (pkg:apk/...?distro=alpine-3.9, deb, rpm), so
          # Hibou can match apk/deb/rpm advisories release-scoped and reconcile
          # OSV + Trivy sources. See ../SECURITY-FIXTURES.md.
          - name: OS image SBOMs
            run: |
              for os in alpine debian rhel; do
                docker build -t "hibou-fixture-$os" "images/$os"
                trivy image --format cyclonedx \
                  --output "$os-image-sbom.cdx.json" "hibou-fixture-$os"
              done

      # ────────────────────────────────────────────────────────────────
      # Phase 4 — Hibou upload (SERIAL barrier: needs every artifact above).
      # Uploads coverage + JUnit + SBOM + SARIF as one snapshot for this
      # (repo, ref, sha). On `release` this persists the release-ref snapshot.
      # ────────────────────────────────────────────────────────────────
      - name: Check Hibou upload config
        id: hibou
        env:
          HIBOU_SERVER_URL: ${{ vars.HIBOU_SERVER_URL }}
          HIBOU_API_TOKEN: ${{ secrets.HIBOU_API_TOKEN }}
        run: |
          if [[ -n "$HIBOU_API_TOKEN" && "$HIBOU_SERVER_URL" =~ ^https?://[^[:space:]]+ && "$HIBOU_SERVER_URL" != *your-hibou-domain* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Hibou upload skipped — set repo variable HIBOU_SERVER_URL (https://) and secret HIBOU_API_TOKEN to enable."
          fi

      # Published TypeScript action (public repo → usable from any repo).
      # Downloads a version-matched CLI from `server` (the Hibou instance,
      # e.g. https://hibouhq.com) and uploads coverage/SBOM/SARIF there.
      - name: Upload snapshot to Hibou
        if: steps.hibou.outputs.enabled == 'true'
        continue-on-error: true
        uses: hibouhq/hibou-upload-action@7fcd357ea4494d8cc043c3b6b9f06a62b5f4f781 # v0.1.2
        with:
          complete: 'true'
          server: ${{ vars.HIBOU_SERVER_URL }}
          token: ${{ secrets.HIBOU_API_TOKEN }}
          file: |
            go/coverage.out
            go/junit-go.xml
            ts/coverage/lcov.info
            ts/junit-front.xml
            java/target/site/jacoco/jacoco.xml
            rust/lcov.info
            *.sarif
            *.cdx.json

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            go/coverage.out
            go/junit-go.xml
            ts/coverage/lcov.info
            ts/junit-front.xml
            java/target/site/jacoco/jacoco.xml
            java/target/surefire-reports/*.xml
            rust/lcov.info
            *.sarif
            *-sbom.cdx.json
          if-no-files-found: warn
